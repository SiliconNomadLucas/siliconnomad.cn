name: Build and deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment SDKs
        run: python -m pip install --disable-pip-version-check oss2 aliyun-python-sdk-core aliyun-python-sdk-ecs

      - name: Obtain short-lived Alibaba Cloud credentials
        id: aliyun-credentials
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.ALIYUN_DEPLOY_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          audience: github-actions
          role-session-name: github-actions-site-deploy

      - name: Publish to ECS through Cloud Assistant
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ steps.aliyun-credentials.outputs.aliyun-access-key-id }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ steps.aliyun-credentials.outputs.aliyun-access-key-secret }}
          ALIBABA_CLOUD_SECURITY_TOKEN: ${{ steps.aliyun-credentials.outputs.aliyun-security-token }}
          ALIYUN_REGION_ID: cn-guangzhou
          ALIYUN_ECS_INSTANCE_ID: REMOVED_ECS_INSTANCE_ID
          ALIYUN_OSS_BUCKET: ${{ vars.ALIYUN_DEPLOY_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: https://oss-cn-guangzhou.aliyuncs.com
        run: python .github/scripts/deploy_to_aliyun.py
